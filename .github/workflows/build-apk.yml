name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.3
  GODOT_TAG: 4.3-stable

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download Godot and export templates
        run: |
          set -e
          base=https://github.com/godotengine/godot/releases/download/${GODOT_TAG}
          curl -sSL -o godot.zip ${base}/Godot_v${GODOT_TAG}_linux.x86_64.zip
          curl -sSL -o templates.tpz ${base}/Godot_v${GODOT_TAG}_export_templates.tpz
          unzip -q godot.zip && mv Godot_v${GODOT_TAG}_linux.x86_64 $HOME/godot && chmod +x $HOME/godot
          mkdir -p $HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q templates.tpz
          mv templates/android_* templates/version.txt $HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf templates godot.zip templates.tpz

      - name: Editor settings (Android SDK and Java paths)
        run: |
          mkdir -p $HOME/.config/godot
          for f in editor_settings-4.tres editor_settings-${GODOT_VERSION}.tres; do
          cat > $HOME/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/ci/test.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          sed -i 's/^          //' $HOME/.config/godot/$f
          done
          ls $ANDROID_HOME/build-tools

      - name: Import assets
        run: |
          $HOME/godot --headless --path . --import || true
          $HOME/godot --headless --path . --import

      - name: Check every road can be cleared
        run: $HOME/godot --headless --path . --script res://tests/bot.gd

      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KS_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > $RUNNER_TEMP/release.keystore
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=${KS_USER:-orbitroads}" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KS_PASS" >> $GITHUB_ENV
          else
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$GITHUB_WORKSPACE/ci/test.keystore" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Export APK
        run: |
          mkdir -p build
          $HOME/godot --headless --path . --export-release "Android" build/orbit-roads.apk
          ls -la build
          test -s build/orbit-roads.apk

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-roads-apk
          path: build/orbit-roads.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/orbit-roads.apk --title "Orbit Roads (latest build)" --notes "Built from ${GITHUB_SHA::7}. Download orbit-roads.apk and open it on your phone to install."
